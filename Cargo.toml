[package]
name = "lock2"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = {version = "0.19" , features = ["dynamic_linking"]}
bevy_dylib = "0.19"
bevy_rand = "0.15"
bevy_prng = "0.15"
avian2d = "0.7"
serde = "1.0"
strum = "0.28"
strum_macros = "0.28"
bevy_asset_loader = "0.27"
leafwing-input-manager = { version = "0.21" }
itertools = "0.15"
rand = "0.10"

bevy_stats = {git = "https://github.com/Zellenon/bevy_stats.git"}
#bevy_editor_pls = {git = "https://github.com/ltsoveranakin/bevy_editor_pls"}

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy)
[profile.dev.package."*"]
opt-level = 3
